<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QC Inspector MSB</title>
<meta name="theme-color" content="#4A76A8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F7;--ink:#2B3A55;--mut:#7B8AA0;--pri:#4A76A8;--line:#DFE6EF;--ok:#2F7A5E;--oks:#E2F1EB;--ng:#A8434B;--ngs:#F8E6E7;--wr:#94681C;--wrs:#FAF0DC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Nunito Sans','Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header img{height:26px}
.clk{flex:1;text-align:right;line-height:1.25}.clk b{display:block;font-size:12px;font-weight:600}.clk span{font-size:15px;color:var(--pri);font-variant-numeric:tabular-nums;font-weight:700}
.ib{position:relative;border:0;background:var(--bg);color:var(--ink);border-radius:12px;height:38px;min-width:38px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
.ib i{position:absolute;top:-4px;right:-4px;background:#C9646B;color:#fff;font:700 10px/16px sans-serif;min-width:16px;border-radius:8px;text-align:center}
main{max-width:720px;margin:0 auto;padding:16px}
h2{margin:0;font-size:20px;font-weight:700}h3{margin:14px 0 4px}.mut,small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{border:0;border-radius:18px;padding:18px 14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.97)}.tile b{display:block;font-size:22px;letter-spacing:.5px;color:var(--pri)}.tile span{font-size:13px}
.card,.info,.frm,.ban{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(43,58,85,.06)}
.card{cursor:pointer}.rw{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chip{font-style:normal;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--oks);color:var(--ok)}.chip.ng{background:var(--ngs);color:var(--ng)}.chip.wr{background:var(--wrs);color:var(--wr)}
.ban{background:var(--wrs);color:var(--wr);font-weight:600;cursor:pointer}
.bar{display:flex;align-items:center;gap:10px}.bar h2{flex:1}
.bk,.sm{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
.sm{background:#fff;padding:6px 12px;border-radius:10px;font-size:13px}
input,select,textarea{width:100%;font:inherit;color:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:4px}
input:focus,select:focus,textarea:focus{outline:2px solid #B9CDE4;border-color:var(--pri)}
input[readonly]{background:var(--bg)}.srch{margin:12px 0}
.chips{display:flex;gap:8px;overflow:auto;margin-bottom:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;white-space:nowrap;color:var(--mut);cursor:pointer}
.chips .on{background:var(--pri);border-color:var(--pri);color:#fff}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}.info small{display:block;font-size:11px}.info span{font-size:13px;overflow-wrap:anywhere}
.frm label{display:block;margin-bottom:12px}.frm label span{font-size:13px;color:var(--mut)}
.prev{padding:10px 14px;border-radius:12px;font-weight:600}.prev.ok{background:var(--oks);color:var(--ok)}.prev.ng{background:var(--ngs);color:var(--ng)}
.acts{display:flex;gap:10px;margin:14px 0 30px}
.btn{flex:1;border:0;background:var(--pri);color:#fff;border-radius:14px;padding:13px;font:inherit;font-weight:700;cursor:pointer;width:100%}
.btn.gh{background:#fff;color:var(--pri);border:1px solid var(--line)}
.lg{max-width:360px;margin:8vh auto;padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px}
.lg img{width:80%;margin:0 auto}.lg .clk{text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:20;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{display:none;position:fixed;inset:0;background:rgba(238,242,247,.6);z-index:15;align-items:center;justify-content:center}
#busy.on{display:flex}
#busy:after{content:'';width:34px;height:34px;border:4px solid #C9D6E6;border-top-color:var(--pri);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="busy"></div>
<script>

</script>
<script src="app.js"></script>
</body>
</html>
