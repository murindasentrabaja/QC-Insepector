<style>
:root{--bg:#EEF2F7;--ink:#26344F;--mut:#7B8AA0;--pri:#3F6DA3;--line:#DFE6EF;--ok:#2F7A5E;--oks:#E2F1EB;--ng:#A8434B;--ngs:#F8E6E7;--wr:#94681C;--wrs:#FAF0DC;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Nunito Sans','Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

.dy.e{background:none}.dy.td{outline:2px solid var(--pri)}.dy.has{background:#fff;box-shadow:inset 0 0 0 1.5px #F0D3A6}

.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.kp div{background:#fff;border-radius:16px;padding:10px 6px;text-align:center}.kp b{display:block;font-size:22px}
.st{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--bg);margin-top:8px}.st i{height:100%;transition:width .6s}.st .ok{background:#38B38A}.st .wr{background:#F0B84D}.st .ng{background:#D9626B}

#sh{position:fixed;inset:0;z-index:30;visibility:hidden;transition:visibility .3s}#sh.on{visibility:visible}
.bd{position:absolute;inset:0;background:rgba(20,30,50,.45);opacity:0;transition:opacity .3s}.on .bd{opacity:1}
.pn{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;max-height:92vh;overflow:auto;padding:14px 16px calc(24px + var(--sb));background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}.on .pn{transform:none}
.hd{position:sticky;top:-14px;z-index:2;display:flex;align-items:center;gap:10px;padding:6px 0 10px;background:var(--bg)}.hd>div{flex:1;min-width:0}
.ibk{width:38px;height:38px;border-radius:12px;background:#fff;font-size:18px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px;background:#fff;border-radius:18px;text-align:left;box-shadow:0 2px 8px rgba(38,52,79,.06);transition:transform .15s}.mt:active{transform:scale(.97)}.mt .em{font-size:26px}
.mt.fin{grid-column:1/-1;flex-direction:row;align-items:center}.mt.fin b{flex:1}
.fm{background:#fff;border-radius:20px;padding:14px}.fm .f{margin-bottom:14px}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}.pl button{padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-weight:700;font-size:14px;transition:.15s}
.pl button.on{color:#fff;border-color:transparent;background:var(--pri)}.pl .ok.on{background:#2F9E74}.pl .ng.on{background:#D9626B}.pl .wr.on{background:#E0A03A}
.prev{padding:10px 14px;border-radius:14px;font-weight:700;margin-bottom:14px}.prev.ok{background:var(--oks);color:var(--ok)}.prev.ng{background:var(--ngs);color:var(--ng)}.prev:empty{display:none}
.btn{position:relative;width:100%;padding:14px;border-radius:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3F6DA3,#5B94D0)}
.btn.gh{background:#fff;color:var(--pri)}.btn.gh.dg{color:var(--ng)}.btn.ld{color:transparent;pointer-events:none}
.btn.ld:after{content:'';position:absolute;inset:0;margin:auto;width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.sk{height:92px;margin:10px 0;border-radius:18px;background:linear-gradient(90deg,#E4EAF3 25%,#F4F7FB 50%,#E4EAF3 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.lg{display:flex;flex-direction:column;gap:12px;max-width:360px;margin:9vh auto;padding:26px 22px;text-align:center;background:#fff;border-radius:26px;box-shadow:0 10px 30px rgba(38,52,79,.12)}.lg img{width:84px;margin:0 auto}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));z-index:70;max-width:88vw;padding:10px 18px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;text-align:center;opacity:0;transform:translate(-50%,20px);transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.er{background:var(--ng)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--bg:#F3EFE8;--ink:#22303C;--mut:#7E8790;--pri:#35566E;--line:#E4DDD0;--ok:#3F7D63;--oks:#E4F0E9;--ng:#A4504F;--ngs:#F6E5E3;--wr:#9A7130;--wrs:#F7EEDB;--au:#B08D57}

.mg{gap:12px}.mt{padding:16px;gap:8px;border:1px solid #EEE7DA;border-radius:20px}.mt .em{font-size:32px}.mt b{font-size:17px}
.fm{padding:18px;border-radius:22px}.pl button{padding:11px 18px;font-size:15px}.kp b{font-size:26px}.kp div{padding:14px 6px}
.seg{display:flex;gap:6px;padding:5px;background:#EAE3D6;border-radius:18px;margin-bottom:12px}.seg button{flex:1;padding:11px 8px;border-radius:14px;font-weight:700;font-size:14.5px;color:#6D746F}.seg em{font-style:normal;margin-left:6px;font-size:12px;opacity:.7}.seg .on{background:#fff;color:var(--pri);box-shadow:0 3px 10px rgba(31,58,77,.12)}
.ps{display:block;margin-bottom:10px}.ps span{font-size:12px;font-weight:700;color:var(--mut)}
.tb{display:none;background:#fff;border:1px solid #EEE7DA;border-radius:20px;padding:10px;margin:10px 0 12px}.tb.open{display:block}

.tn.l1{margin-left:18px}.tn.l2{margin-left:36px;font-weight:500}.ar{width:28px;height:28px;border-radius:8px;color:var(--mut);transition:transform .2s}.ar.o{transform:rotate(90deg)}.ar.x{visibility:hidden}
.wr2{display:block}

.chip.na{background:#ECEEF0;color:#6B747C}.dots u.na{filter:none;opacity:1;background:#ECEEF0;border-color:#C9CFD4}.pl .na.on{background:#7B8790}

<body><div id="bar"></div><div id="app"><div class="sp"><img src="icon-192.png" alt=""><i></i></div></div><div id="toast"></div>

<script>
// Tempel URL Web App hasil deploy Apps Script (Code.gs) di sini
window.API_URL='https://script.google.com/macros/s/AKfycbwFq_ZO219_qYwBZGWSxuJd30kVE60KWAxi7WTH4MsDH26TrztjILbWDLdrTlr5SEVmYw/exec';
</script>
<script>
const API=window.API_URL,LS=localStorage,$=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MD={FitUp_Inspection:['Fitup','🔩','Fit-Up'],Dimensional_Inspection:['Dimensional','📏','Dimensional'],Welding_Inspection:['Welding','🔥','Welding'],Leaktest_Inspection:['Leaktest','💧','Leak Test'],Alignment_Inspection:['Alignment','🎯','Alignment'],NDT_Report:['NDT','🔬','NDT'],Coating_Inspection:['Coating','🎨','Coating']};
const KS=Object.keys(MD),PL=['okng','status','leak'];
const P={task:'<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',prog:'<path d="M18 20V10M12 20V4M6 20v-6"/>',fin:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',prof:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'};
const NAV=[['task','Tugas','#4A76A8,#6FA3DB'],['cal','Jadwal','#E08A2E,#F5B85A'],['prog','Progres','#2F9E74,#5CCB9C'],['fin','Final','#7A5BD0,#A48BEB'],['prof','Profil','#D45C8A,#F08DB0']];
const TT={task:['Tugas','Pilih pengiriman, lalu isi inspeksi'],cal:['Jadwal Kirim','Ketuk tanggal untuk melihat unit'],prog:['Progres','Ringkasan hasil inspeksi'],fin:['Final Inspection','Hasil akhir per unit'],prof:['Profil','Akun dan kalibrasi alat']};
const S={t:LS.qt||'',b:null,fi:[],mod:{},tab:'task',lim:60,op:{},tw:false,f:{c:'',m:'',d:'',q:'',r:'',cu:'',k:'',p:''}};
const now=new Date();S.y=now.getFullYear();S.mo=now.getMonth();
const pad=n=>('0'+n).slice(-2),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dfmt=d=>d?+d.slice(8,10)+' '+MO[+d.slice(5,7)-1].slice(0,3)+' '+d.slice(0,4):'-';
const short=c=>String(c||'').replace(/^PT\s+/i,'');
const cls=s=>!s?'':/^(accept|ok)$/i.test(s)?'ok':/^(reject|ng|bocor|tetes)$/i.test(s)?'ng':/^n\/?a$/i.test(s)?'na':'wr';
const cnt=(a,k)=>a.reduce((m,o)=>(m[k(o)]=(m[k(o)]||0)+1,m),{});
const put=(k,v)=>{try{LS[k]=JSON.stringify(v)}catch(e){}};
const empty=t=>`<div class="cd mut" style="text-align:center;cursor:default">${t}</div>`;
const more=n=>n>S.lim?`<button class="btn gh" data-a=mo>Tampilkan lebih banyak (${n-S.lim})</button>`:'';
let tt,bc=0;
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className='on'+(e?' er':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2800)};
const busy=d=>{bc+=d;$('#bar').classList.toggle('on',bc>0)};
// Kirim POST; jika Google membalas teks doGet (POST dialihkan jadi GET), ulangi lewat GET ?p=. Balasan HTML dijelaskan, bukan crash.
async function send(o){
 const body=JSON.stringify(o);
 let t=await (await fetch(API,{method:'POST',body})).text();
 if(/^\s*QC Inspector MSB API aktif/.test(t))t=await (await fetch(API+(API.includes('?')?'&':'?')+'p='+encodeURIComponent(body))).text();
 try{return JSON.parse(t)}
 catch(e){throw Error(/^\s*</.test(t)?'Server membalas halaman HTML, bukan data. Periksa deployment Apps Script: akses "Siapa saja" dan deploy versi terbaru.':'Balasan server tidak dikenali: '+t.slice(0,60))}
}
async function api(q){busy(1);try{const j=await send(Object.assign({},q,{t:S.t}));
 if(!j.ok){if(j.err==='AUTH'){out();throw Error('Sesi berakhir, silakan masuk lagi')}throw Error(j.err)}return j}
 catch(e){throw e.message==='Failed to fetch'?Error('Tidak ada koneksi ke server'):e}finally{busy(-1)}}
const rowsOf=j=>j.rows.map(r=>{const o={};j.cols.forEach((c,i)=>o[c]=r[i]);o.row=r[r.length-1];return o});
async function loadFI(){const[j,ju]=await Promise.all([api({a:'list',m:'Final_Inspection'}),api({a:'list',m:'FitUp_Inspection'})]),kt={};
 rowsOf(ju).forEach(r=>{if(r.Kode_Serial)kt[r.Kode_Serial]=r.Kategori});S.mod.FitUp_Inspection=ju;
 S.fi=rowsOf(j).filter(o=>o.Kode_Serial).map(o=>(o.d=String(o.Tanggal_Kirim_Diminta||'').slice(0,10),o.k=/built/i.test(kt[o.Kode_Serial]||'')?'Builtup':/counter/i.test(kt[o.Kode_Serial]||'')?'Counterweight':'',o));put('qfi',S.fi)}

// ---------- Login & start ----------
async function login(){$('#app').innerHTML=`<div class=lg><img src="icon-192.png" alt=""><h2>QC Inspector</h2><small>PT Murinda Sentra Baja</small><select id=lu><option>Memuat pengguna…</option></select><input id=lp type=password placeholder=Password autocomplete=current-password><button class=btn id=lb data-a=lg>Masuk</button></div>`;
 $('#lp').addEventListener('keydown',e=>e.key==='Enter'&&doLogin());
 try{const j=await api({a:'users'});$('#lu').innerHTML=j.users.map(u=>`<option>${esc(u)}</option>`).join('')}catch(e){toast(e.message,1)}}
async function doLogin(){const b=$('#lb');b.classList.add('ld');

// ---------- Event ----------
function act(a){if(a==='rf')return refresh();if(a==='rp')return rep(S.cur);if(a==='tw'){S.tw=!S.tw;return draw()}if(a==='sv')return save();if(a==='lo')return out();if(a==='lg')return doLogin();
 if(a==='mo'){S.lim+=60;$('#ls').innerHTML=S.tab==='fin'?fList():tList()}}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let x;
 if(x=g('[data-tg]')){const k=x.dataset.tg;S.op[k]=!S.op[k];return draw()}
 if(x=g('[data-sel]')){const d=x.dataset;S.f.c=d.sc||'';S.f.m=d.sm||'';S.f.d=d.sd||'';if(d.sc)S.op['c'+d.sc]=true;if(d.sm)S.op['m'+d.sc+d.sm]=true;S.lim=60;S.tw=false;return draw()}
 if(x=g('[data-kt]')){Object.assign(S.f,{k:x.dataset.kt,c:'',m:'',d:'',p:'',cu:''});S.lim=60;return draw()}
 if(x=g('[data-x]')){if(x.dataset.x==='b'&&S.bk)S.bk();else $('#sh').classList.remove('on');return}
 if(x=g('[data-pv]')){const F=S.fm,h=F.m.f[x.parentNode.dataset.p][0];F.pick(h,x.dataset.pv);if(h==='Status')F.T.st=true;F.pv();return}
 if(x=g('[data-m]'))return openForm(x.dataset.m,S.cur);
 if(x=g('[data-s]')){const o=S.fi.find(y=>y.row==x.dataset.s);return o&&openSerial(o,g('#sh')?S.last:null)}
 if(x=g('[data-d]'))return openDay(x.dataset.d);
 if(x=g('[data-t]')){S.tab=x.dataset.t;S.f.q='';S.lim=60;draw();scrollTo(0,0);return}
 if(x=g('[data-nv]')){S.mo+=+x.dataset.nv;if(S.mo<0){S.mo=11;S.y--}if(S.mo>11){S.mo=0;S.y++}return draw()}
 if(x=g('[data-cu]')){S.f.cu=x.dataset.cu;return draw()}
 if(x=g('[data-r]')){S.f.r=x.dataset.r;S.lim=60;return draw()}
 if(x=g('[data-a]'))return act(x.dataset.a)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){S.f.q=t.value;S.lim=60;const l=$('#ls');if(l)l.innerHTML=S.tab==='fin'?fList():tList();return}
 if(t.dataset.k){const f=S.f,k=t.dataset.k;f[k]=t.value;if(k==='c'){f.m='';f.d=''}if(k==='m')f.d='';S.lim=60;return draw()}
 if(t.dataset.i!=null&&S.fm){S.fm.V[S.fm.m.f[t.dataset.i][0]]=t.value;S.fm.pv()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
S.t?start():login();
